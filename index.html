<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>حسابي</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f7fb;color:#172033}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.header{background:#2563eb;color:white;padding:22px 15px;text-align:center}
.header h1{margin:0;font-size:28px}.header p{margin:7px 0 0;font-size:14px;opacity:.9}
.container{max-width:900px;margin:auto;padding:15px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px}
.nav button{border:0;background:white;border-radius:12px;padding:12px 5px;color:#374151;box-shadow:0 2px 8px #00000010}
.nav button.active{background:#2563eb;color:white}
.section{display:none}.section.active{display:block}
.card{background:white;border-radius:16px;padding:17px;margin-bottom:15px;box-shadow:0 3px 12px #0000000d}
.card h2{margin:0 0 15px;font-size:19px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:15px;border-radius:13px;background:#f8fafc;border:1px solid #e5e7eb}
.stat-title{font-size:13px;color:#64748b;margin-bottom:8px}.stat-value{font-size:20px;font-weight:bold}
.green{color:#16a34a}.red{color:#dc2626}.blue{color:#2563eb}
.form-group{margin-bottom:13px}.form-group label{display:block;margin-bottom:6px;font-size:14px;font-weight:bold}
input,select,textarea{width:100%;border:1px solid #d7dde7;border-radius:10px;padding:12px;font-size:15px;background:white;outline:0}
input:focus,select:focus,textarea:focus{border-color:#2563eb}
textarea{min-height:90px;resize:vertical}
.direction{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.direction button{padding:13px;border:2px solid #e5e7eb;border-radius:12px;background:white}
.direction button.selected{border-color:#2563eb;background:#eff6ff;color:#2563eb;font-weight:bold}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:bold}
.btn-primary{background:#2563eb;color:white}.btn-success{background:#16a34a;color:white}
.btn-danger{background:#dc2626;color:white}.btn-secondary{background:#e5e7eb;color:#374151}
.btn-full{width:100%}.btn-row{display:flex;gap:7px;flex-wrap:wrap}
.person{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:10px}
.person-top{display:flex;justify-content:space-between;gap:10px}
.person-name{font-size:17px;font-weight:bold}.person-phone{font-size:13px;color:#64748b;margin-top:4px}
.balance{font-weight:bold;text-align:left}.badge{display:inline-block;padding:5px 8px;border-radius:8px;font-size:12px;margin-top:8px}
.badge-green{background:#dcfce7;color:#15803d}.badge-red{background:#fee2e2;color:#b91c1c}
.badge-gray{background:#f1f5f9;color:#475569}.badge-orange{background:#ffedd5;color:#c2410c}
.transaction{border-right:4px solid #2563eb;background:#f8fafc;padding:12px;border-radius:10px;margin-bottom:9px}
.transaction.debt{border-right-color:#dc2626}.transaction.payment{border-right-color:#16a34a}
.transaction-title{font-weight:bold;margin-bottom:5px}.transaction-info{font-size:13px;color:#64748b;line-height:1.8}
.empty{text-align:center;padding:30px 10px;color:#94a3b8}
.search{margin-bottom:12px}.profile-header{background:#eff6ff;border-radius:14px;padding:16px;margin-bottom:15px}
hr{border:0;border-top:1px solid #e5e7eb;margin:15px 0}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:1000;padding:20px;align-items:center;justify-content:center}
.modal.show{display:flex}.modal-box{background:white;width:100%;max-width:500px;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}
.modal-title{font-size:20px;font-weight:bold;margin-bottom:15px}
@media(max-width:600px){.nav{grid-template-columns:1fr 1fr}.person-top{flex-direction:column}.balance{text-align:right}}
@media print{
body{background:white}.header,.nav,.no-print{display:none!important}.container{max-width:none;padding:0}.section{display:none!important}
#printArea{display:block!important}
}
#printArea{display:none}
</style>
</head>

<body>

<header class="header">
<h1>💰 حسابي</h1>
<p>إدارة الديون والمعاملات الشخصية</p>
</header>

<div class="container">

<nav class="nav">
<button id="navHome" class="active" onclick="showSection('home')">🏠 الرئيسية</button>
<button id="navPeople" onclick="showSection('people')">👥 الأشخاص</button>
<button id="navAdd" onclick="showSection('add')">➕ إضافة دين</button>
<button id="navTransactions" onclick="showSection('transactions')">🔄 المعاملات</button>
</nav>

<section id="home" class="section active">
<div class="card">
<h2>📊 ملخص الحساب</h2>
<div class="stats">
<div class="stat"><div class="stat-title">💚 لي عند الناس</div><div id="homeOwed" class="stat-value green">0 دج</div></div>
<div class="stat"><div class="stat-title">🔴 عليّ للناس</div><div id="homeDebt" class="stat-value red">0 دج</div></div>
<div class="stat"><div class="stat-title">👥 الأشخاص</div><div id="homePeople" class="stat-value blue">0</div></div>
<div class="stat"><div class="stat-title">🔄 المعاملات</div><div id="homeTransactions" class="stat-value">0</div></div>
</div>
</div>

<div class="card">
<h2>⏰ الاستحقاقات</h2>
<div id="upcomingList"></div>
</div>

<div class="card">
<h2>⚠️ المتأخرات</h2>
<div id="overdueList"></div>
</div>

<div class="card no-print">
<h2>💾 النسخ الاحتياطي</h2>
<div class="btn-row">
<button class="btn btn-primary" onclick="backupData()">⬇️ تصدير البيانات</button>
<button class="btn btn-secondary" onclick="document.getElementById('restoreFile').click()">⬆️ استرجاع البيانات</button>
<input id="restoreFile" type="file" accept=".json" hidden onchange="restoreData(event)">
</div>
</div>
</section>

<section id="people" class="section">
<div class="card">
<h2>👥 الأشخاص</h2>
<input id="peopleSearch" class="search" placeholder="ابحث عن اسم أو رقم..." oninput="renderPeople()">
<div id="peopleList"></div>
</div>
</section>

<section id="add" class="section">
<div class="card">
<h2>➕ إضافة دين</h2>

<div class="form-group">
<label>اسم الشخص</label>
<input id="personName" placeholder="مثال: محمد">
</div>

<div class="form-group">
<label>رقم الهاتف</label>
<input id="personPhone" type="tel" placeholder="0550000000">
</div>

<div class="form-group">
<label>نوع الدين</label>
<div class="direction">
<button id="owedBtn" class="selected" onclick="selectDirection('owed')">💚 لي عنده</button>
<button id="debtBtn" onclick="selectDirection('debt')">🔴 عليّ له</button>
</div>
</div>

<div class="form-group">
<label>المبلغ</label>
<input id="debtAmount" type="number" min="0" placeholder="0">
</div>

<div class="form-group">
<label>تاريخ الدين</label>
<input id="debtDate" type="date">
</div>

<div class="form-group">
<label>تاريخ الاستحقاق</label>
<input id="dueDate" type="date">
</div>

<div class="form-group">
<label>ملاحظة</label>
<textarea id="debtNote" placeholder="اكتب ملاحظة..."></textarea>
</div>

<button class="btn btn-primary btn-full" onclick="addDebt()">💾 حفظ الدين</button>
</div>
</section>

<section id="transactions" class="section">
<div class="card">
<h2>🔄 جميع المعاملات</h2>
<div id="transactionsList"></div>
</div>
</section>

<section id="profile" class="section">
<div class="card"><div id="profileContent"></div></div>
</section>

</div>

<!-- EDIT PERSON MODAL -->
<div id="editModal" class="modal">
<div class="modal-box">
<div class="modal-title">✏️ تعديل الشخص</div>

<div class="form-group">
<label>الاسم</label>
<input id="editName">
</div>

<div class="form-group">
<label>رقم الهاتف</label>
<input id="editPhone">
</div>

<div class="form-group">
<label>ملاحظات</label>
<textarea id="editNote"></textarea>
</div>

<div class="btn-row">
<button class="btn btn-primary" onclick="savePersonEdit()">💾 حفظ</button>
<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
</div>
</div>
</div>

<!-- PAYMENT MODAL -->
<div id="paymentModal" class="modal">
<div class="modal-box">
<div class="modal-title">💰 تسجيل دفعة</div>

<div id="paymentInfo" class="muted" style="margin-bottom:15px"></div>

<div class="form-group">
<label>مبلغ الدفعة</label>
<input id="paymentAmount" type="number" min="0" placeholder="0">
</div>

<div class="form-group">
<label>تاريخ الدفعة</label>
<input id="paymentDate" type="date">
</div>

<div class="form-group">
<label>ملاحظة</label>
<textarea id="paymentNote" placeholder="مثال: دفعة نقدية..."></textarea>
</div>

<div class="btn-row">
<button class="btn btn-success" onclick="savePayment()">💾 تسجيل الدفعة</button>
<button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
</div>
</div>
</div>

<div id="printArea"></div>

<script>

let people=[];
let transactions=[];
let selectedDirection="owed";
let editingPersonId=null;
let paymentPersonId=null;
let currentPersonId=null;

function loadData(){
try{
people=JSON.parse(localStorage.getItem("hisabi_people")||"[]");
transactions=JSON.parse(localStorage.getItem("hisabi_transactions")||"[]");
if(!Array.isArray(people))people=[];
if(!Array.isArray(transactions))transactions=[];
}catch(e){people=[];transactions=[]}
}

function saveData(){
localStorage.setItem("hisabi_people",JSON.stringify(people));
localStorage.setItem("hisabi_transactions",JSON.stringify(transactions));
}

function id(){
return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function money(n){
return Number(n||0).toLocaleString("ar-DZ",{maximumFractionDigits:2})+" دج";
}

function esc(x){
return String(x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function today(){
let d=new Date();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function dateText(x){
if(!x)return"بدون تاريخ";
let p=x.split("-");
return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:x;
}

function showSection(id){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");

document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));

if(id==="home")document.getElementById("navHome").classList.add("active");
if(id==="people")document.getElementById("navPeople").classList.add("active");
if(id==="add")document.getElementById("navAdd").classList.add("active");
if(id==="transactions")document.getElementById("navTransactions").classList.add("active");

if(id==="home")renderHome();
if(id==="people")renderPeople();
if(id==="transactions")renderTransactions();
}

function selectDirection(x){
selectedDirection=x;
document.getElementById("owedBtn").classList.toggle("selected",x==="owed");
document.getElementById("debtBtn").classList.toggle("selected",x==="debt");
}

function clearForm(){
document.getElementById("personName").value="";
document.getElementById("personPhone").value="";
document.getElementById("debtAmount").value="";
document.getElementById("debtDate").value=today();
document.getElementById("dueDate").value="";
document.getElementById("debtNote").value="";
selectDirection("owed");
}

function addDebt(){
let name=document.getElementById("personName").value.trim();
let phone=document.getElementById("personPhone").value.trim();
let amount=Number(document.getElementById("debtAmount").value);
let date=document.getElementById("debtDate").value||today();
let due=document.getElementById("dueDate").value;
let note=document.getElementById("debtNote").value.trim();

if(!name)return alert("أدخل اسم الشخص.");
if(!amount||amount<=0)return alert("أدخل مبلغًا صحيحًا.");

let p=people.find(x=>x.name.toLowerCase()===name.toLowerCase());

if(!p){
p={id:id(),name:name,phone:phone,balance:0,note:""};
people.push(p);
}else if(phone)p.phone=phone;

if(selectedDirection==="owed")p.balance+=amount;
else p.balance-=amount;

transactions.push({
id:id(),personId:p.id,personName:p.name,type:"debt",
direction:selectedDirection,amount:amount,date:date,dueDate:due,note:note
});

saveData();
clearForm();
refresh();
alert("✅ تم حفظ الدين.");
showSection("people");
}

function renderPeople(){
let list=document.getElementById("peopleList");
let q=document.getElementById("peopleSearch").value.trim().toLowerCase();

let arr=people.filter(p=>
p.name.toLowerCase().includes(q)||(p.phone||"").includes(q)
);

if(!arr.length){
list.innerHTML='<div class="empty">👥 لا يوجد أشخاص</div>';
return;
}

list.innerHTML=arr.map(p=>{
let bal="";
let badge="";

if(p.balance>0){
bal="لك عنده "+money(p.balance);
badge='<span class="badge badge-green">💚 له عندك</span>';
}else if(p.balance<0){
bal="عليك له "+money(Math.abs(p.balance));
badge='<span class="badge badge-red">🔴 عليك له</span>';
}else{
bal="الحساب مسدد";
badge='<span class="badge badge-gray">✓ مسدد</span>';
}

return `
<div class="person">
<div class="person-top">
<div>
<div class="person-name">${esc(p.name)}</div>
<div class="person-phone">${p.phone?"📞 "+esc(p.phone):"لا يوجد رقم"}</div>
</div>
<div class="balance">${esc(bal)}</div>
</div>
${badge}
${p.note?`<div class="small muted" style="margin-top:7px">📝 ${esc(p.note)}</div>`:""}
<div class="btn-row" style="margin-top:12px">
<button class="btn btn-primary" onclick="openProfile('${p.id}')">📄 كشف الحساب</button>
<button class="btn btn-success" onclick="openPayment('${p.id}')">💰 دفعة</button>
<button class="btn btn-secondary" onclick="editPerson('${p.id}')">✏️ تعديل</button>
<button class="btn btn-danger" onclick="deletePerson('${p.id}')">🗑️ حذف</button>
</div>
</div>`;
}).join("");
}

function editPerson(pid){
let p=people.find(x=>x.id===pid);
if(!p)return;

editingPersonId=pid;
document.getElementById("editName").value=p.name;
document.getElementById("editPhone").value=p.phone||"";
document.getElementById("editNote").value=p.note||"";
document.getElementById("editModal").classList.add("show");
}

function savePersonEdit(){
let p=people.find(x=>x.id===editingPersonId);
if(!p)return;

let name=document.getElementById("editName").value.trim();
if(!name)return alert("أدخل الاسم.");

p.name=name;
p.phone=document.getElementById("editPhone").value.trim();
p.note=document.getElementById("editNote").value.trim();

transactions.forEach(t=>{
if(t.personId===p.id)t.personName=p.name;
});

saveData();
closeModal();
refresh();
}

function deletePerson(pid){
let p=people.find(x=>x.id===pid);
if(!p)return;

if(!confirm("هل تريد حذف "+p.name+"؟\n\nسيتم حذف الشخص وجميع معاملاته."))return;

people=people.filter(x=>x.id!==pid);
transactions=transactions.filter(x=>x.personId!==pid);

saveData();
refresh();
}

function openPayment(pid){
let p=people.find(x=>x.id===pid);
if(!p)return;

if(p.balance===0){
alert("الحساب مسدد بالفعل.");
return;
}

paymentPersonId=pid;

document.getElementById("paymentInfo").innerHTML=
"الشخص: <b>"+esc(p.name)+"</b><br>المتبقي: <b>"+money(Math.abs(p.balance))+"</b>";

document.getElementById("paymentAmount").value="";
document.getElementById("paymentDate").value=today();
document.getElementById("paymentNote").value="";

document.getElementById("paymentModal").classList.add("show");
}

function savePayment(){
let p=people.find(x=>x.id===paymentPersonId);
if(!p)return;

let amount=Number(document.getElementById("paymentAmount").value);
let date=document.getElementById("paymentDate").value||today();
let note=document.getElementById("paymentNote").value.trim();

if(!amount||amount<=0)return alert("أدخل مبلغًا صحيحًا.");

if(amount>Math.abs(p.balance)){
return alert("المبلغ أكبر من المتبقي.");
}

if(p.balance>0)p.balance-=amount;
else p.balance+=amount;

transactions.push({
id:id(),personId:p.id,personName:p.name,type:"payment",
amount:amount,date:date,note:note||"دفعة"
});

saveData();
closeModal();
refresh();
alert("✅ تم تسجيل الدفعة.");
}

function closeModal(){
document.querySelectorAll(".modal").forEach(x=>x.classList.remove("show"));
}

function openProfile(pid){
let p=people.find(x=>x.id===pid);
if(!p)return;

currentPersonId=pid;

let tx=transactions.filter(x=>x.personId===pid).sort((a,b)=>new Date(b.date)-new Date(a.date));

let balance=p.balance>0?
`<div class="green"><b>لك عنده ${money(p.balance)}</b></div>`:
p.balance<0?
`<div class="red"><b>عليك له ${money(Math.abs(p.balance))}</b></div>`:
`<div class="green"><b>✓ الحساب مسدد</b></div>`;

let history=tx.length?tx.map(t=>{
if(t.type==="payment"){
return `<div class="transaction payment">
<div class="transaction-title">💰 دفعة - ${money(t.amount)}</div>
<div class="transaction-info">التاريخ: ${dateText(t.date)}${t.note?"<br>الملاحظة: "+esc(t.note):""}</div>
</div>`;
}

return `<div class="transaction debt">
<div class="transaction-title">${t.direction==="owed"?"💚 لي عنده":"🔴 عليّ له"} - ${money(t.amount)}</div>
<div class="transaction-info">
التاريخ: ${dateText(t.date)}
${t.dueDate?"<br>الاستحقاق: "+dateText(t.dueDate):""}
${t.note?"<br>الملاحظة: "+esc(t.note):""}
</div>
</div>`;
}).join(""):'<div class="empty">لا توجد معاملات</div>';

document.getElementById("profileContent").innerHTML=`
<div class="profile-header">
<button class="btn btn-secondary" onclick="showSection('people')">← رجوع</button>
<hr>
<h2>👤 ${esc(p.name)}</h2>
${p.phone?"<div class='muted'>📞 "+esc(p.phone)+"</div>":""}
${p.note?"<div class='muted' style='margin-top:7px'>📝 "+esc(p.note)+"</div>":""}
<div style="margin-top:14px">${balance}</div>
</div>

<div class="btn-row no-print" style="margin-bottom:15px">
<button class="btn btn-success" onclick="openPayment('${p.id}')">💰 تسجيل دفعة</button>
<button class="btn btn-primary" onclick="addDebtFor('${p.id}')">➕ إضافة دين</button>
<button class="btn btn-secondary" onclick="printStatement('${p.id}')">🖨️ طباعة</button>
</div>

<div>
<h3>🔄 سجل المعاملات</h3>
${history}
</div>`;

showSection("profile");
}

function addDebtFor(pid){
let p=people.find(x=>x.id===pid);
if(!p)return;

showSection("add");
document.getElementById("personName").value=p.name;
document.getElementById("personPhone").value=p.phone||"";
}

function renderTransactions(){
let list=document.getElementById("transactionsList");

let arr=[...transactions].sort((a,b)=>new Date(b.date)-new Date(a.date));

if(!arr.length){
list.innerHTML='<div class="empty">🔄 لا توجد معاملات</div>';
return;
}

list.innerHTML=arr.map(t=>{
if(t.type==="payment"){
return `<div class="transaction payment">
<div class="transaction-title">💰 دفعة - ${esc(t.personName)}</div>
<div class="transaction-info">المبلغ: ${money(t.amount)}<br>التاريخ: ${dateText(t.date)}${t.note?"<br>"+esc(t.note):""}</div>
</div>`;
}

return `<div class="transaction debt">
<div class="transaction-title">${t.direction==="owed"?"💚 لي عنده":"🔴 عليّ له"} - ${esc(t.personName)}</div>
<div class="transaction-info">
المبلغ: ${money(t.amount)}<br>
التاريخ: ${dateText(t.date)}
${t.dueDate?"<br>الاستحقاق: "+dateText(t.dueDate):""}
${t.note?"<br>📝 "+esc(t.note):""}
</div>
</div>`;
}).join("");
}

function renderHome(){
let owed=0,debt=0;

people.forEach(p=>{
if(p.balance>0)owed+=p.balance;
if(p.balance<0)debt+=Math.abs(p.balance);
});

document.getElementById("homeOwed").textContent=money(owed);
document.getElementById("homeDebt").textContent=money(debt);
document.getElementById("homePeople").textContent=people.length;
document.getElementById("homeTransactions").textContent=transactions.length;

renderUpcoming();
renderOverdue();
}

function renderUpcoming(){
let todayValue=today();

let arr=transactions.filter(t=>
t.type==="debt"&&t.dueDate&&t.dueDate>=todayValue
).sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)).slice(0,10);

let list=document.getElementById("upcomingList");

if(!arr.length){
list.innerHTML='<div class="empty">📅 لا توجد استحقاقات قادمة</div>';
return;
}

list.innerHTML=arr.map(t=>`
<div class="transaction">
<div class="transaction-title">👤 ${esc(t.personName)}</div>
<div class="transaction-info">
المبلغ: ${money(t.amount)}<br>
الاستحقاق: ${dateText(t.dueDate)}
</div>
</div>`).join("");
}

function renderOverdue(){
let now=today();

let arr=transactions.filter(t=>
t.type==="debt"&&t.dueDate&&t.dueDate<now
);

let list=document.getElementById("overdueList");

if(!arr.length){
list.innerHTML='<div class="empty">✅ لا توجد ديون متأخرة</div>';
return;
}

list.innerHTML=arr.map(t=>`
<div class="transaction debt">

function printStatement(pid){
let p=people.find(x=>x.id===pid);
if(!p)return;

let tx=transactions.filter(x=>x.personId===pid).sort((a,b)=>new Date(a.date)-new Date(b.date));

document.getElementById("printArea").innerHTML=`
<h1 style="text-align:center">💰 حسابي</h1>
<h2>كشف حساب</h2>
<hr>
<p><b>الاسم:</b> ${esc(p.name)}</p>
<p><b>الهاتف:</b> ${esc(p.phone||"غير موجود")}</p>
<p><b>الرصيد:</b> ${p.balance>0?"له عنده ":"عليه له "}${money(Math.abs(p.balance))}</p>
<hr>
<h3>المعاملات</h3>
${tx.map(t=>`
<div style="border-bottom:1px solid #ddd;padding:10px 0">
<b>${t.type==="payment"?"💰 دفعة":"🔄 دين"}</b>
- ${money(t.amount)}
<br>
التاريخ: ${dateText(t.date)}
${t.dueDate?"<br>الاستحقاق: "+dateText(t.dueDate):""}
${t.note?"<br>ملاحظة: "+esc(t.note):""}
</div>`).join("")}
`;

window.print();
}

function backupData(){
let data={
app:"حسابي",
version:1,
date:new Date().toISOString(),
people:people,
transactions:transactions
};

let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
let url=URL.createObjectURL(blob);
let a=document.createElement("a");

a.href=url;
a.download="hisabi-backup-"+today()+".json";
a.click();

URL.revokeObjectURL(url);
}

function restoreData(event){
let file=event.target.files[0];
if(!file)return;

let reader=new FileReader();

reader.onload=function(e){
try{
let data=JSON.parse(e.target.result);

if(!Array.isArray(data.people)||!Array.isArray(data.transactions)){
throw new Error();
}

if(!confirm("سيتم استبدال البيانات الحالية بالنسخة الاحتياطية. هل أنت متأكد؟"))return;

people=data.people;
transactions=data.transactions;

saveData();
refresh();

alert("✅ تم استرجاع البيانات بنجاح.");

}catch(err){
alert("❌ ملف النسخة الاحتياطية غير صالح.");
}

event.target.value="";
};

reader.readAsText(file);
}

function refresh(){
renderHome();
renderPeople();
renderTransactions();
}

function init(){
loadData();

document.getElementById("debtDate").value=today();

refresh();
}

document.addEventListener("DOMContentLoaded",init);

</script>
