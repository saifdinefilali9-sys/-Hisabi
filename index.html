<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>حسابي</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,Tahoma,sans-serif;
 background:#f4f7fb;
 color:#172033;
}

header{
 background:#2563eb;
 color:white;
 padding:20px 16px;
 text-align:center;
}

header h1{
 margin:0 0 6px;
 font-size:28px;
}

header p{
 margin:0;
 opacity:.9;
}

.container{
 max-width:900px;
 margin:auto;
 padding:15px;
}

nav{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 margin-bottom:15px;
}

nav button{
 border:0;
 background:white;
 border-radius:12px;
 padding:12px 6px;
 font-size:14px;
 cursor:pointer;
 box-shadow:0 2px 8px #00000012;
}

nav button.active{
 background:#2563eb;
 color:white;
}

.section{
 display:none;
}

.section.active{
 display:block;
}

.card{
 background:white;
 border-radius:16px;
 padding:16px;
 margin-bottom:15px;
 box-shadow:0 2px 10px #00000010;
}

.card h2{
 margin-top:0;
}

.stats{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.stat{
 padding:18px;
 border-radius:14px;
 background:#f8fafc;
}

.stat strong{
 display:block;
 font-size:22px;
 margin-top:8px;
}

.green{
 color:#16a34a;
}

.red{
 color:#dc2626;
}

.blue{
 color:#2563eb;
}

input,
select,
textarea{
 width:100%;
 padding:12px;
 border:1px solid #d8dee9;
 border-radius:10px;
 font-size:15px;
 margin-bottom:10px;
 background:white;
}

textarea{
 min-height:90px;
 resize:vertical;
}

button{
 cursor:pointer;
}

.btn{
 width:100%;
 border:0;
 border-radius:10px;
 padding:13px;
 font-size:16px;
 margin-top:5px;
}

.btn-primary{
 background:#2563eb;
 color:white;
}

.btn-green{
 background:#16a34a;
 color:white;
}

.btn-red{
 background:#dc2626;
 color:white;
}

.person{
 border:1px solid #e5e7eb;
 border-radius:13px;
 padding:14px;
 margin-bottom:10px;
}

.person-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.person-name{
 font-size:18px;
 font-weight:bold;
}

.muted{
 color:#64748b;
 font-size:14px;
 margin-top:5px;
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:10px;
}

.empty{
 text-align:center;
 padding:30px;
 color:#64748b;
}

.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
}

.badge-green{
 background:#dcfce7;
 color:#166534;
}

.badge-red{
 background:#fee2e2;
 color:#991b1b;
}

.transaction{
 padding:12px 0;
 border-bottom:1px solid #eee;
}

.transaction:last-child{
 border-bottom:0;
}

@media(max-width:600px){

 nav{
  grid-template-columns:repeat(2,1fr);
 }

 .stats{
  grid-template-columns:1fr;
 }

 .actions{
  grid-template-columns:1fr;
 }

}
</style>
</head>

<body>

<header>
 <h1>💰 حسابي</h1>
 <p>إدارة الديون والحسابات بسهولة</p>
</header>

<div class="container">

<nav>
 <button class="active" onclick="showSection('home',this)">🏠 الرئيسية</button>
 <button onclick="showSection('people',this)">👥 الأشخاص</button>
 <button onclick="showSection('addDebt',this)">➕ إضافة دين</button>
 <button onclick="showSection('transactions',this)">🔄 المعاملات</button>
</nav>


<!-- الرئيسية -->

<section id="home" class="section active">

 <div class="card">

  <h2>📊 الملخص</h2>

  <div class="stats">

   <div class="stat">
    💚 لي عند الناس
    <strong id="totalOwed" class="green">0 دج</strong>
   </div>

   <div class="stat">
    🔴 عليّ للناس
    <strong id="totalDebt" class="red">0 دج</strong>
   </div>

   <div class="stat">
    👥 الأشخاص
    <strong id="peopleCount" class="blue">0</strong>
   </div>

   <div class="stat">
    💰 الديون المفتوحة
    <strong id="openDebts" class="blue">0</strong>
   </div>

  </div>

 </div>

 <div class="card">

  <h2>⏰ المواعيد القادمة</h2>

  <div id="upcomingList"></div>

 </div>

</section>


<!-- الأشخاص -->

<section id="people" class="section">

 <div class="card">

  <h2>👥 الأشخاص</h2>

  <input
   id="personSearch"
   placeholder="🔎 ابحث عن شخص..."
   oninput="renderPeople()"
  >

  <div id="peopleList"></div>

 </div>

</section>


<!-- إضافة دين -->

<section id="addDebt" class="section">

 <div class="card">

  <h2>➕ تسجيل دين جديد</h2>

  <input
   id="debtPerson"
   placeholder="اسم الشخص"
  >

  <input
   id="debtPhone"
   placeholder="رقم الهاتف"
   type="tel"
  >

  <select id="debtType">

   <option value="owed">
    💚 هو مدين لي
   </option>

   <option value="debt">
    🔴 أنا مدين له
   </option>

  </select>

  <input
   id="debtAmount"
   type="number"
   min="0"
   placeholder="مبلغ الدين"
  >

  <label>📅 تاريخ الدين</label>

  <input
   id="debtDate"
   type="date"
  >

  <label>⏰ موعد الدفع</label>

  <input
   id="dueDate"
   type="date"
  >

  <textarea
   id="debtNote"
   placeholder="ملاحظة..."
  ></textarea>

  <button
   class="btn btn-primary"
   onclick="addDebt()"
  >
   💾 حفظ الدين
  </button>

 </div>

</section>


<!-- المعاملات -->

<section id="transactions" class="section">

 <div class="card">

  <h2>🔄 آخر المعاملات</h2>

  <div id="transactionsList"></div>

 </div>

</section>


<!-- كشف الحساب -->

<section id="profile" class="section">

 <div class="card">

  <div id="profileContent"></div>

 </div>

</section>

</div>


<script>

let people=
 JSON.parse(
  localStorage.getItem("hisabi_people")||"[]"
 );

let transactions=
 JSON.parse(
  localStorage.getItem("hisabi_transactions")||"[]"
 );


function saveData(){

 localStorage.setItem(
  "hisabi_people",
  JSON.stringify(people)
 );

 localStorage.setItem(
  "hisabi_transactions",
  JSON.stringify(transactions)
 );

}


function money(value){

 return Number(value||0).toLocaleString("ar-DZ")
 +" دج";

}


function escapeHtml(value){

 return String(value||"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


function id(){

 return Date.now().toString(36)
 +""
 +Math.random().toString(36).slice(2,7);

}


function showSection(name,button){

 document
  .querySelectorAll(".section")
  .forEach(s=>s.classList.remove("active"));

 const section=
  document.getElementById(name);

 if(section){
  section.classList.add("active");
 }

 document
  .querySelectorAll("nav button")
  .forEach(b=>b.classList.remove("active"));

 if(button){
  button.classList.add("active");
 }

}


function addDebt(){

 const name=
  document.getElementById("debtPerson")
  .value.trim();

 const phone=
  document.getElementById("debtPhone")
  .value.trim();

 const type=
  document.getElementById("debtType").value;

 const amount=
  Number(
   document.getElementById("debtAmount").value||0
  );

 const debtDate=
  document.getElementById("debtDate").value;

 const dueDate=
  document.getElementById("dueDate").value;

 const note=
  document.getElementById("debtNote")
  .value.trim();


 if(!name){

  alert("أدخل اسم الشخص");

  return;

 }


 if(amount<=0){

  alert("أدخل مبلغًا صحيحًا");

  return;

 }


 let person=
  people.find(
   p=>
    p.name===name &&
    p.phone===phone
  );


 if(!person){

  person={
   id:id(),
   name,
   phone,
   balance:0,
   note:""
  };

  people.push(person);

 }


 if(type==="owed"){

  person.balance+=amount;

 }else{

  person.balance-=amount;

 }


 transactions.unshift({

  id:id(),

  personId:person.id,

  personName:person.name,

  type:"debt",

  direction:type,

  amount,

  date:debtDate||new Date().toISOString().slice(0,10),

  dueDate,

  note

 });


 saveData();


 document.getElementById("debtPerson").value="";
 document.getElementById("debtPhone").value="";
 document.getElementById("debtAmount").value="";
 document.getElementById("debtDate").value="";
 document.getElementById("dueDate").value="";
 document.getElementById("debtNote").value="";


 refresh();


 alert("✅ تم تسجيل الدين");


 showSection("people");

}


function renderPeople(){

 const box=
  document.getElementById("peopleList");

 const search=
  (
   document.getElementById("personSearch")
   ?.value||""
  )
  .trim()
  .toLowerCase();


 const list=
  people.filter(
   p=>
    p.name.toLowerCase().includes(search)||
    p.phone.includes(search)
  );


 if(!list.length){

  box.innerHTML=
   `<div class="empty">
     لا يوجد أشخاص
    </div>`;

  return;

 }


 box.innerHTML=
  list.map(p=>{

   const positive=
    Number(p.balance)>0;

   return `

    <div class="person">

     <div class="person-head">

      <div>

       <div class="person-name">
        👤 ${escapeHtml(p.name)}
       </div>

       ${
        p.phone
        ?`
         <div class="muted">
          📞 ${escapeHtml(p.phone)}
         </div>
        `
        :""
       }

      </div>

      <span class="${
       positive
       ?"badge badge-green"
       :"badge badge-red"
      }">

       ${
        positive
        ?"له عندك؟"
        :"عليه"
       }

      </span>

     </div>


     <div class="muted">

      الرصيد:

      <strong>
       ${money(Math.abs(p.balance))}
      </strong>

     </div>


     <div class="actions">

      <button
       class="btn btn-primary"
       onclick="openProfile('${p.id}')"
      >
       📄 كشف الحساب
      </button>

      <button
       class="btn btn-green"
       onclick="payPerson('${p.id}')"
      >
       💵 تسجيل دفعة
      </button>

     </div>

    </div>

   `;

  }).join("");

}


function openProfile(personId){

 const person=
  people.find(p=>p.id===personId);

 if(!person)return;


 const personTransactions=
  transactions.filter(
   t=>t.personId===personId
  );


 document.getElementById("profileContent")
 .innerHTML=`

  <h2>
   👤 ${escapeHtml(person.name)}
  </h2>

  ${
   person.phone
   ?`
    <div class="muted">
     📞 ${escapeHtml(person.phone)}
    </div>
   `
   :""
  }

  <hr>

  <h3>
   الرصيد الحالي:
  </h3>

  <div style="font-size:28px;font-weight:bold">

   ${money(Math.abs(person.balance))}

  </div>

  <p>

   ${
    person.balance>0
    ?"💚 هذا المبلغ له عندك"
    :person.balance<0
    ?"🔴 هذا المبلغ عليك له"
    :"✅ الحساب مسدد"
   }

  </p>

  <h3>
   📋 سجل المعاملات
  </h3>

  ${
   personTransactions.length
   ?
   personTransactions.map(t=>`

    <div class="transaction">

     <strong>

      ${
       t.type==="payment"
       ?"💵 دفعة"
       :"📝 دين"
      }

     </strong>

     <div>
      ${money(t.amount)}
     </div>

     <div class="muted">
      ${escapeHtml(t.date||"")}
     </div>

     ${
      t.note
      ?`
       <div class="muted">
        📝 ${escapeHtml(t.note)}
       </div>
      `
      :""
     }

    </div>

   `).join("")
   :
   `<div class="empty">
     لا توجد معاملات
    </div>`
  `;


 showSection("profile");

}


function payPerson(personId){

 const person=
  people.find(p=>p.id===personId);

 if(!person)return;


 const amount=
  Number(
   prompt(
    "أدخل مبلغ الدفعة:"
   )||0
  );


 if(amount<=0)return;


 if(person.balance>0){

  person.balance=
   Math.max(
    0,
    person.balance-amount
   );

 }else{

  person.balance+=amount;

 }


 transactions.unshift({

  id:id(),

  personId:person.id,

  personName:person.name,

  type:"payment",

  amount,

  date:new Date().toISOString(),

  note:"دفعة"

 });


 saveData();

 refresh();

 openProfile(personId);

}


function renderTransactions(){

 const box=
  document.getElementById("transactionsList");


 if(!transactions.length){

  box.innerHTML=
   `<div class="empty">
    لا توجد معاملات
   </div>`;

  return;

 }


 box.innerHTML=
  transactions
  .slice(0,100)
  .map(t=>`

   <div class="transaction">

    <strong>

     ${
      t.type==="payment"
      ?"💵 دفعة"
      :"📝 دين"
     }

     — ${escapeHtml(t.personName)}

    </strong>

    <div>
     ${money(t.amount)}
    </div>

    <div class="muted">
     ${escapeHtml(t.date||"")}
    </div>

   </div>

  `)
  .join("");

}


function renderHome(){

 let owed=0;
 let debt=0;


 people.forEach(p=>{

  if(p.balance>0){

   owed+=p.balance;

  }else{

   debt+=Math.abs(p.balance);

  }

 });


 document.getElementById("totalOwed")
 .textContent=money(owed);


 document.getElementById("totalDebt")
 .textContent=money(debt);


 document.getElementById("peopleCount")
 .textContent=people.length;


 document.getElementById("openDebts")
 .textContent=
  people.filter(
   p=>Number(p.balance)!==0
  ).length;


 const upcoming=
  transactions
  .filter(t=>t.dueDate)
  .sort(
   (a,b)=>
    new Date(a.dueDate)-
    new Date(b.dueDate)
  )
  .slice(0,5);


 const box=
  document.getElementById("upcomingList");


 if(!upcoming.length){

  box.innerHTML=
   `<div class="empty">
    لا توجد مواعيد مسجلة
   </div>`;

  return;

 }


 box.innerHTML=
  upcoming.map(t=>`

   <div class="transaction">

    <strong>
     👤 ${escapeHtml(t.personName)}
    </strong>

    <div>
     ${money(t.amount)}
    </div>

    <div class="muted">
     📅 ${escapeHtml(t.dueDate)}
    </div>

   </div>

  `).join("");

}


function refresh(){

 renderHome();
 renderPeople();
 renderTransactions();

}


refresh();

</script>

</body>
</html>
